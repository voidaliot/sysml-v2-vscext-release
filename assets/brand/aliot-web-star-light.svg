<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aliot website star — light, refined</title>
  <desc id="description">Four slender pale blue-to-violet rays behind a separate deep-blue circular ring and an opaque white centre. Light rounded tile, with transparent outer corners. Typography is outlined.</desc>
  <defs>
    <linearGradient id="tile" x1="100" y1="4" x2="372" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <radialGradient id="ambience" cx="256" cy="256" r="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2562d7" stop-opacity=".025"/>
      <stop offset=".64" stop-color="#2562d7" stop-opacity=".015"/>
      <stop offset="1" stop-color="#2562d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="north" x1="256" y1="52" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2c9ff"/><stop offset=".60" stop-color="#84baff"/><stop offset="1" stop-color="#b0a4ee"/>
    </linearGradient>
    <linearGradient id="south" x1="256" y1="460" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2c9ff"/><stop offset=".60" stop-color="#84baff"/><stop offset="1" stop-color="#b0a4ee"/>
    </linearGradient>
    <linearGradient id="west" x1="62" y1="256" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2c9ff"/><stop offset=".58" stop-color="#84baff"/><stop offset="1" stop-color="#b0a4ee"/>
    </linearGradient>
    <linearGradient id="east" x1="450" y1="256" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2c9ff"/><stop offset=".58" stop-color="#84baff"/><stop offset="1" stop-color="#b0a4ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="211" y1="204" x2="301" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2265c0"/><stop offset=".44" stop-color="#2562d7"/><stop offset="1" stop-color="#2265c0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7060b8"/><stop offset="1" stop-color="#6456c5"/>
    </linearGradient>
    <clipPath id="tile-clip"><rect x="3" y="3" width="506" height="506" rx="101"/></clipPath>
  </defs>
  <rect x="3" y="3" width="506" height="506" rx="101" fill="url(#tile)" stroke="#d6dfec" stroke-width="3"/>
  <g clip-path="url(#tile-clip)">
    <rect x="3" y="3" width="506" height="506" fill="url(#ambience)"/>
    <!-- Four rays are independent shapes, not a cut-out star. -->
    <g id="rays">
      <path d="M256 52 L295 256 H217 Z" fill="url(#north)"/>
      <path d="M256 460 L217 256 H295 Z" fill="url(#south)"/>
      <path d="M62 256 L256 217 V295 Z" fill="url(#west)"/>
      <path d="M450 256 L256 295 V217 Z" fill="url(#east)"/>
    </g>
    
    <!-- Separate circular body, followed by a solid white dot in BOTH themes. -->
    <circle id="cobalt-ring" cx="256" cy="256" r="65" fill="url(#ring)"/>
    <circle id="white-centre" cx="256" cy="256" r="47" fill="#ffffff"/>
  </g>
</svg>
